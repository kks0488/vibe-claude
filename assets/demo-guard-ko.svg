<g class="l6"><text x="28" y="254" fill="#d97757" font-weight="700">›</text><text x="54" y="254" fill="#f0f6fc" font-weight="700">아 잠깐, 그 스크린샷 필요했어. 되돌려줘</text><rect class="c6" x="52" y="232" width="920" height="30" fill="#0d1117"/></g>
<g class="l7"><circle cx="34" cy="278" r="4.5" fill="#79c0ff"/><text x="54" y="284" fill="#e6edf3">/vibe-claude:undo  →  휴지통에서 복구</text></g>
<g class="l8"><text x="70" y="314" fill="#3fb950">✓ 파일 212개가 돌아왔어요. 다른 건 그대로예요.</text></g>
