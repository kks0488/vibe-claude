<g class="l0"><text x="28" y="74" fill="#d97757" font-weight="700">›</text><text x="54" y="74" fill="#f0f6fc" font-weight="700">make the checkout button green</text><rect class="c0" x="52" y="52" width="920" height="30" fill="#0d1117"/></g>
<g class="l1"><circle cx="34" cy="98" r="4.5" fill="#79c0ff"/><text x="54" y="104" fill="#e6edf3">Edit  app/checkout.tsx</text></g>
