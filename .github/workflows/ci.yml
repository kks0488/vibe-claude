name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Version numbers agree
        run: |
          v=$(cat VERSION)
          p=$(python -c "import json; print('v' + json.load(open('.claude-plugin/plugin.json'))['version'])")
          s=$(python -c "import re; print('v' + re.search(r'VERSION = \"([^\"]+)\"', open('hooks/vibe.py').read()).group(1))")
          echo "VERSION=$v plugin.json=$p vibe.py=$s"
          test "$v" = "$p" && test "$v" = "$s"
      - name: Validate plugin
        run: |
          npm install -g @anthropic-ai/claude-code
          # Errors fail the build. Warnings are shown but allowed: newer Claude Code versions warn that
          # any plugin name containing "claude" reads like an official one, and renaming would break installs.
          claude plugin validate .
          claude plugin validate .claude-plugin/plugin.json
